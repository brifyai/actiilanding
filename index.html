<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Jugada es con ACT II</title>
    <meta
      name="description"
      content="Promoción La Jugada es con ACT II: participa por una Smart TV de 42 pulgadas y recibe un bucket promocional en compras participantes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing" aria-labelledby="promo-title">
      <h1 id="promo-title" class="sr-only">La jugada es con ACT II</h1>

      <section class="desktop-scene" aria-label="Landing promocional ACT II para escritorio">
        <div class="scene scene-desktop">
          <img class="layer layer-bg" src="assets/layers/fondo.png" alt="" />
          <img class="layer layer-popcorn" src="assets/layers/popcorn.png" alt="Productos ACT II" />
          <img class="layer layer-claim" src="assets/layers/claim.png" alt="La jugada es con ACT II" />
          <img class="layer layer-tv" src="assets/layers/tv-42.png" alt="Smart TV de 42 pulgadas" />
          <img class="layer layer-description" src="assets/layers/descripcion.png" alt="Descripción de la promoción" />
          <img class="layer layer-steps" src="assets/layers/mecanica.png" alt="Pasos para participar" />
          <img class="layer layer-legal" src="assets/layers/legal.png" alt="Bases legales y vigencia" />
          <a
            class="layer layer-qr-link"
            href="https://www.lajugadaconactii.cl"
            target="_blank"
            rel="noreferrer"
            aria-label="Abrir sitio web de la promoción"
          >
            <img class="layer-qr" src="assets/layers/qr.png" alt="Código QR de la promoción" />
          </a>
          <a class="desktop-site-link" href="https://www.lajugadaconactii.cl" target="_blank" rel="noreferrer">
            Ir al sitio oficial
          </a>
        </div>
      </section>

      <section class="mobile-scene" aria-label="Landing promocional ACT II para móviles">
        <div class="mobile-hero">
          <img class="mobile-bg" src="assets/layers/fondo.png" alt="" />
          <img class="mobile-popcorn" src="assets/layers/popcorn.png" alt="Productos ACT II" />
          <img class="mobile-claim" src="assets/layers/claim.png" alt="La jugada es con ACT II" />
          <img class="mobile-description" src="assets/layers/descripcion.png" alt="Descripción de la promoción" />
          <img class="mobile-tv" src="assets/layers/tv-42.png" alt="Smart TV de 42 pulgadas" />
        </div>

        <section class="mobile-panel mobile-panel-primary">
          <a class="mobile-button" href="https://www.lajugadaconactii.cl" target="_blank" rel="noreferrer">
            Participar ahora
          </a>
        </section>

        <section class="mobile-panel mobile-panel-steps">
          <img class="mobile-steps-image" src="assets/layers/mecanica.png" alt="Pasos para participar" />
        </section>

        <section class="mobile-panel mobile-panel-footer">
          <a
            class="mobile-qr-link"
            href="https://www.lajugadaconactii.cl"
            target="_blank"
            rel="noreferrer"
            aria-label="Abrir sitio web de la promoción"
          >
            <img class="mobile-qr" src="assets/layers/qr.png" alt="Código QR de la promoción" />
          </a>
          <img class="mobile-legal" src="assets/layers/legal.png" alt="Bases legales y vigencia" />
        </section>
      </section>
    </main>
  </body>
</html>
