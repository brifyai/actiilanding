<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Jugada es con ACT II</title>
    <meta
      name="description"
      content="Promoción La Jugada es con ACT II: participa por una Smart TV de 43 pulgadas y recibe un balde de cabritas en compras participantes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing" aria-labelledby="promo-title">
      <h1 id="promo-title" class="sr-only">La jugada es con ACT II</h1>

      <!-- DESKTOP: capas posicionadas exactamente como el PSD -->
      <section class="desktop-scene" aria-label="Landing promocional ACT II para escritorio">
        <div class="scene scene-desktop">
          <img class="layer layer-bg" src="assets/layers/fondo.png" alt="" />
          <img class="layer layer-popcorn" src="assets/layers/popcorn.png" alt="Productos ACT II" />
          <img class="layer layer-claim" src="assets/layers/claim.png" alt="La jugada es con ACT II" />
          <img class="layer layer-tv" src="assets/layers/tv-42.png" alt="Smart TV de 43 pulgadas" />
          <img class="layer layer-description" src="assets/layers/descripcion.png" alt="Descripción de la promoción" />
          <img class="layer layer-steps" src="assets/layers/mecanica.png" alt="Pasos para participar" />
          <img class="layer layer-legal" src="assets/layers/legal.png" alt="Bases legales y vigencia" />
          <a class="layer layer-qr-link" href="https://www.lajugadaconactii.cl" target="_blank" rel="noreferrer" aria-label="Abrir sitio web de la promoción">
            <img class="layer-qr" src="assets/layers/qr.png" alt="Código QR de la promoción" />
          </a>
        </div>
      </section>

      <!-- MOBILE: mismas capas, apiladas verticalmente sobre el fondo -->
      <section class="mobile-scene" aria-label="Landing promocional ACT II para móviles">

        <!-- 0. Fondo cancha como base -->
        <div class="mobile-bg-wrap">
          <img class="mobile-bg" src="assets/layers/fondo.png" alt="" />
        </div>

        <!-- 1. Claim -->
        <div class="mobile-layer-wrap">
          <img class="mobile-layer mobile-claim" src="assets/layers/claim.png" alt="La jugada es con ACT II" />
        </div>

        <!-- 2. Descripción -->
        <div class="mobile-layer-wrap">
          <img class="mobile-layer mobile-description" src="assets/layers/descripcion.png" alt="Descripción de la promoción" />
        </div>

        <!-- 3. TV -->
        <div class="mobile-layer-wrap">
          <img class="mobile-layer mobile-tv" src="assets/layers/tv-42.png" alt="Smart TV de 43 pulgadas" />
        </div>

        <!-- 4. Productos -->
        <div class="mobile-layer-wrap">
          <img class="mobile-layer mobile-popcorn" src="assets/layers/popcorn.png" alt="Productos ACT II" />
        </div>

        <!-- 5. CTA -->
        <div class="mobile-cta-wrap">
          <a class="mobile-cta" href="https://www.lajugadaconactii.cl" target="_blank" rel="noreferrer">
            Participar ahora
          </a>
        </div>

        <!-- 6. Mecánica -->
        <div class="mobile-layer-wrap">
          <img class="mobile-layer mobile-steps" src="assets/layers/mecanica.png" alt="Pasos para participar" />
        </div>

        <!-- 7. QR + Legal -->
        <div class="mobile-footer">
          <a class="mobile-qr-link" href="https://www.lajugadaconactii.cl" target="_blank" rel="noreferrer" aria-label="Abrir sitio web de la promoción">
            <img class="mobile-qr" src="assets/layers/qr.png" alt="Código QR de la promoción" />
          </a>
          <img class="mobile-legal" src="assets/layers/legal.png" alt="Bases legales y vigencia" />
        </div>
      </section>
    </main>
  </body>
</html>
